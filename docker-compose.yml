services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/zoombot.db
    volumes:
      - zoombot_data:/app/data

  web:
    build: ./web-app
    ports: ["3000:3000"]
    environment:
      # Browser fetches API; use host-accessible URL
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  zoombot_data:
